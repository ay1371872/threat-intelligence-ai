version: "3.8"

# Threat Intelligence Full-Stack Docker Containerization
# Course: 23CSE528 - NoSQL Databases using MongoDB
# Author: Ayush Yadav (USN: 24BTLCL003) | JAIN (Deemed-to-be University)
# Synthesizes Exercise 13 (Docker Deployment) & Appendix A.6

services:

  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: threat-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threat_intel_db
    volumes:
      - threat_mongo_data:/data/db
    networks:
      - threat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: threat_intel_db
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HOST_DIAGNOSTIC_URL: http://host.docker.internal:8000
      HOST_DIAGNOSTIC_TOKEN: ${HOST_DIAGNOSTIC_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - threat-network
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - uvicorn
      - threat_intel_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  # 3. Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      HOST_DIAGNOSTIC_URL: http://host.docker.internal:8000
      HOST_DIAGNOSTIC_TOKEN: ${HOST_DIAGNOSTIC_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - threat-network
    depends_on:
      - backend
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
      - --server.enableCORS
      - "false"
      - --server.enableXsrfProtection
      - "false"

networks:
  threat-network:
    driver: bridge

volumes:
  threat_mongo_data:
    driver: local