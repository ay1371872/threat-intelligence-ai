services:
  llm:
    image: ollama/ollama:latest
    container_name: ollama-llm
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - "C:/Users/AYUSH YADAV/.ollama:/root/.ollama"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
